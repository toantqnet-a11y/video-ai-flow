# One-time, manual lockfile resolution in a trusted GitHub runner.
# Never edits your repository; download the generated lock, review, then commit.
name: Prepare npm lockfile (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve metadata only (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lock against every workspace and pinned HyperFrames
        run: node tools/ci-github-lock.mjs
      - name: Upload generated lock for HUMAN REVIEW (not auto-committed)
        uses: actions/upload-artifact@v4
        with:
          name: contentstudio-npm-package-lock-review
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
