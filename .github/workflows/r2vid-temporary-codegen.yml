# Temporary branch-only deterministic codegen. Delete after syncing files.
name: R2VID Temporary API Generator
on:
  push:
    branches: [feat/ai-video-r2vid01-05]
    paths:
      - packages/contracts/src/catalog.mjs
      - tools/generate-api.mjs
      - .github/workflows/r2vid-temporary-codegen.yml

permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-video-r2vid01-05
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic offline API, types and SDK codegen
        run: |
          node tools/generate-api.mjs
          node tools/generate-api.mjs --check
          git diff --check
      - name: Commit generated artifacts to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json packages/contracts/src/types.d.mts packages/sdk/src/client.d.mts
          if ! git diff --cached --quiet; then
            git commit -m "chore(r2vid05): regenerate MP4 revision preview contracts"
            git push origin HEAD:refs/heads/feat/ai-video-r2vid01-05
          fi
