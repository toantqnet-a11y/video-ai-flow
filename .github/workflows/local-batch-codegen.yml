name: Local codegen - temporary feature branch
on:
  push:
    branches: [feat/hf-cache-advanced-jobs-storage-and-safe-media]
permissions: {contents: write}
jobs:
  generated:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hf-cache-advanced-jobs-storage-and-safe-media
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute deterministic API and backlog
        run: |
          node tools/generate-api.mjs
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {mergeBacklog,parseVideoRoadmap} from './tools/fi04-backlog.mjs';
          const base=JSON.parse(readFileSync('docs/VIDEO_AI_FLOW_EXTENSION_BACKLOG.json','utf8'));
          const merged=mergeBacklog(base,parseVideoRoadmap(readFileSync('docs/reference/VIDEO_AI_FLOW_EXECUTION_PLAN_V3.md','utf8')));
          if(merged.releaseStatus!=='NOT_READY'||merged.taskCount!==69)process.exit(5);
          writeFileSync('docs/VIDEO_AI_FLOW_MASTER_BACKLOG.json',JSON.stringify(merged,null,2)+'\n');
          JS
          node tools/generate-api.mjs --check
      - name: Commit generated public artifacts only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/api/openapi.json packages/contracts/src/types.d.mts packages/sdk/src/client.d.mts docs/VIDEO_AI_FLOW_MASTER_BACKLOG.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: deterministic API and backlog [generated]'
            git push origin HEAD:feat/hf-cache-advanced-jobs-storage-and-safe-media
          fi
