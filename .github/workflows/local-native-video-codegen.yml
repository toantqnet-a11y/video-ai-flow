name: Native-video backlog generator (temporary)
on:
  push:
    branches: [feat/r3vid03-r308-r2vid02-native-evidence]
permissions: {contents: write}
jobs:
  generated:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r3vid03-r308-r2vid02-native-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate canonical FI-04 status
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {mergeBacklog,parseVideoRoadmap} from './tools/fi04-backlog.mjs';
          const base=JSON.parse(readFileSync('docs/VIDEO_AI_FLOW_EXTENSION_BACKLOG.json','utf8'));
          const merged=mergeBacklog(base,parseVideoRoadmap(readFileSync('docs/reference/VIDEO_AI_FLOW_EXECUTION_PLAN_V3.md','utf8')));
          if(merged.taskCount!==69||merged.releaseStatus!=='NOT_READY')process.exit(13);
          writeFileSync('docs/VIDEO_AI_FLOW_MASTER_BACKLOG.json',JSON.stringify(merged,null,2)+'\n');
          JS
          node tools/generate-api.mjs --check
      - name: Commit only generated backlog to the trusted branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/VIDEO_AI_FLOW_MASTER_BACKLOG.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs: regenerate native acceptance status [generated]'
            git push origin HEAD:feat/r3vid03-r308-r2vid02-native-evidence
          fi
